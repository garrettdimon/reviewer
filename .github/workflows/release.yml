name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Verify tag is on main branch
      env:
        TAG_COMMIT: ${{ github.sha }}
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
          echo "::error::Release tags must point to a commit on the main branch."
          echo "::error::This ensures the code has passed CI before release."
          exit 1
        fi
        echo "Tag points to commit on main branch"

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    environment: rubygems
    outputs:
      release-notes: ${{ steps.metadata.outputs.release-notes }}
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Validate release metadata
      id: metadata
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        delimiter="reviewer_release_notes_$(openssl rand -hex 16)"
        {
          echo "release-notes<<$delimiter"
          bundle exec rake release:notes
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
    - name: Build gem
      run: gem build reviewer.gemspec
    - name: Push to RubyGems
      uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Extract version from tag
      id: version
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        name: v${{ steps.version.outputs.version }}
        body: |
          ## Changes

          ${{ needs.publish.outputs.release-notes }}

          ## Installation

          ```bash
          gem install reviewer -v ${{ steps.version.outputs.version }}
          ```

          Or add to your Gemfile:

          ```ruby
          gem 'reviewer', '~> ${{ steps.version.outputs.version }}'
          ```
        draft: false
        prerelease: false
